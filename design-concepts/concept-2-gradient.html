<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>또리 - 컨셉 2: 대담한 그라데이션</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #f43f5e 50%, #f97316 100%);
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }

        .header-icons {
            display: flex;
            gap: 12px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon i {
            font-size: 20px;
            color: white;
        }

        /* Hero Section */
        .hero {
            padding: 40px 24px 60px;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
        }

        .hero p {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            margin: 0 20px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        /* CTA Buttons */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-gradient {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f43f5e 0%, #f97316 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(244, 63, 94, 0.4);
            transition: all 0.3s;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(244, 63, 94, 0.5);
        }

        .btn-outline {
            width: 100%;
            padding: 16px;
            background: white;
            color: #f43f5e;
            border: 2px solid #f43f5e;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-outline:hover {
            background: #FFF5F5;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 24px 0;
            margin-top: 24px;
            border-top: 1px solid #F3F4F6;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #f43f5e, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: #6B7280;
            margin-top: 4px;
        }

        /* Features Section */
        .features {
            padding: 32px 20px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon i {
            font-size: 24px;
            color: #f43f5e;
        }

        .feature-content h3 {
            font-size: 16px;
            font-weight: 700;
            color: white;
            margin-bottom: 4px;
        }

        .feature-content p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Testimonial */
        .testimonial {
            margin: 20px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
        }

        .testimonial-content {
            font-size: 14px;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 16px;
            font-style: italic;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .author-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #f43f5e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .author-info .name {
            font-size: 14px;
            font-weight: 600;
            color: #111827;
        }

        .author-info .location {
            font-size: 12px;
            color: #6B7280;
        }

        /* Footer */
        .footer {
            padding: 24px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .footer-links a {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        .copyright {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-radius: 20px 20px 0 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #9CA3AF;
            text-decoration: none;
            font-size: 10px;
        }

        .nav-item.active {
            color: #f43f5e;
        }

        .nav-item i {
            font-size: 22px;
        }

        /* Spacer */
        .bottom-spacer {
            height: 100px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">또리</div>
        <div class="header-icons">
            <div class="header-icon">
                <i class="ri-notification-3-line"></i>
            </div>
            <div class="header-icon">
                <i class="ri-global-line"></i>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>진짜 여행,<br>현지 친구와</h1>
        <p>신뢰할 수 있는 현지인과 함께<br>특별한 추억을 만들어보세요</p>
    </section>

    <!-- Main Card -->
    <div class="glass-card">
        <div class="cta-group">
            <button class="btn-gradient">
                <i class="ri-add-line"></i> 동행 요청하기
            </button>
            <button class="btn-outline">
                <i class="ri-search-line"></i> 동행 신청 보러가기
            </button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">2,500+</div>
                <div class="stat-label">성사된 매칭</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">4.8</div>
                <div class="stat-label">평균 평점</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">50+</div>
                <div class="stat-label">지원 도시</div>
            </div>
        </div>
    </div>

    <!-- Features -->
    <section class="features">
        <div class="feature-card">
            <div class="feature-icon">
                <i class="ri-shield-check-line"></i>
            </div>
            <div class="feature-content">
                <h3>안전한 매칭</h3>
                <p>검증된 프로필과 후기 시스템</p>
            </div>
        </div>

        <div class="feature-card">
            <div class="feature-icon">
                <i class="ri-refund-2-line"></i>
            </div>
            <div class="feature-content">
                <h3>투명한 정책</h3>
                <p>명확한 환불 규정과 과금 안내</p>
            </div>
        </div>

        <div class="feature-card">
            <div class="feature-icon">
                <i class="ri-global-line"></i>
            </div>
            <div class="feature-content">
                <h3>다국어 지원</h3>
                <p>한국어, 일본어, 영어 완벽 지원</p>
            </div>
        </div>
    </section>

    <!-- Testimonial -->
    <div class="testimonial">
        <p class="testimonial-content">
            "도쿄에서 만난 현지 친구 덕분에 숨은 맛집들을 다 섭렵했어요. 정말 특별한 경험이었습니다!"
        </p>
        <div class="testimonial-author">
            <div class="author-avatar">김</div>
            <div class="author-info">
                <div class="name">김민지</div>
                <div class="location">도쿄 여행</div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">고객센터</a>
        </div>
        <div class="copyright">© 2025 TORI. All rights reserved.</div>
    </footer>

    <div class="bottom-spacer"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="ri-home-5-fill"></i>
            <span>홈</span>
        </a>
        <a href="#" class="nav-item">
            <i class="ri-file-list-3-line"></i>
            <span>요청</span>
        </a>
        <a href="#" class="nav-item">
            <i class="ri-user-add-line"></i>
            <span>신청</span>
        </a>
        <a href="#" class="nav-item">
            <i class="ri-heart-line"></i>
            <span>매칭</span>
        </a>
        <a href="#" class="nav-item">
            <i class="ri-user-line"></i>
            <span>MY</span>
        </a>
    </nav>
</body>
</html>
